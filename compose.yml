services:
  db:
    image: docker.io/pgvector/pgvector:pg18
    container_name: recall-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recall_db
    ports:
      - "5432:5432"
    volumes:
      - recall_pgdata:/var/lib/postgresql

volumes:
  recall_pgdata:
