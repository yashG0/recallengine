[project]
name = "recallengine"
version = "0.1.0"
description = "Semantic knowledge retrieval and RAG backend built with FastAPI, PostgreSQL (pgvector), and local embeddings."
readme = "README.md"
authors = [
    { name = "yashG0", email = "yashgaurkar0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
	"asyncpg>=0.30.0",
	    "fastapi[standard]>=0.115.0",
	    "pgvector>=0.3.6",
	    "sentence-transformers>=3.3.0",
	    "torch>=2.5.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project.scripts]
recallengine = "recallengine:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
